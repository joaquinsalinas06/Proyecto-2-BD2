services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bd2-backend
    ports:
      - "8000:8000"
    volumes:
      # Volúmenes para datos y código fuente
      - ./src:/app/src
      - ./api:/app/api
      - ./data:/app/data
      - ./indices:/app/indices
      - ./Fashion:/app/Fashion
      - bd2-api-data:/app/data/api
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    networks:
      - bd2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bd2-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bd2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bd2-network:
    driver: bridge

volumes:
  # Volumen para persistir datos del API
  bd2-api-data:
